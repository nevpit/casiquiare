schema_version: v1
name_for_human: Casiquiare Tools
name_for_model: casiquiare_tools
description_for_human: Utilities for Amazon archaeology remote-sensing tasks.
description_for_model: Tools for analyzing LiDAR and imagery to detect features.
tools:
  - type: python
    function:
      name: scan_area
      description: Scan a LiDAR tile and detect geometric features.
      entrypoint: agents.eyes.eyes_tools:scan_area
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Path to the LiDAR file to scan.
          resolution:
            type: number
            description: Output raster resolution in meters.
            default: 1.0
          min_size:
            type: number
            description: Minimum feature size in meters.
            default: 50.0
          max_size:
            type: number
            description: Maximum feature size in meters.
            default: 300.0
        required:
          - path
  - type: python
    function:
      name: train_model
      description: Train a machine-learning classifier on feature data.
      entrypoint: agents.brain.brain_tools:train_model
      parameters:
        type: object
        properties:
          data:
            type: array
            description: Training feature matrix.
            items:
              type: array
              items:
                type: number
          labels:
            type: array
            description: Target labels for each row.
            items:
              type: integer
          n_estimators:
            type: integer
            description: Number of trees or boosting rounds.
            default: 100
          model_type:
            type: string
            description: Algorithm to train (random_forest or xgboost).
            default: random_forest
        required:
          - data
          - labels
  - type: python
    function:
      name: score_likelihood
      description: Score feature vectors using a trained model.
      entrypoint: agents.brain.brain_tools:score_likelihood
      parameters:
        type: object
        properties:
          model:
            type: object
            description: Model returned by train_model.
          data:
            type: array
            description: Feature rows to score.
            items:
              type: array
              items:
                type: number
        required:
          - model
          - data
  - type: python
    function:
      name: validate_features
      description: Validate each feature's size and shape against typical mound statistics.
      entrypoint: agents.brain.brain_tools:validate_features
      parameters:
        type: object
        properties:
          features:
            type: array
            description: Feature dictionaries to validate.
            items:
              type: object
        required:
          - features
  - type: python
    function:
      name: cluster_features
      description: Group geographic features into settlement clusters using DBSCAN.
      entrypoint: agents.brain.brain_tools:cluster_features
      parameters:
        type: object
        properties:
          features:
            type: array
            description: Feature coordinates or feature dictionaries.
            items:
              oneOf:
                - type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                - type: object
          eps:
            type: number
            description: Maximum distance to consider points part of the same cluster.
            default: 100
          min_samples:
            type: integer
            description: Minimum number of samples in a cluster.
            default: 2
        required:
          - features
  - type: python
    function:
      name: exec_code
      description: Execute arbitrary Python code and return the local variables.
      entrypoint: agents.brain.brain_tools:exec_code
      parameters:
        type: object
        properties:
          code:
            type: string
            description: Python code to run.
          local_vars:
            type: object
            description: Optional initial variables for the execution context.
            default: {}
          timeout:
            type: integer
            description: Maximum execution time in seconds.
            default: 5
        required:
          - code
  - type: python
    function:
      name: analyze_environment
      description: Retrieve environmental context metrics for a coordinate.
      entrypoint: agents.context.context_engine:analyze_environment
      parameters:
        type: object
        properties:
          dem:
            type: string
            description: Path to a DEM GeoTIFF.
          land_cover:
            type: string
            description: Path to land-cover data.
          soil:
            type: string
            description: Path to soil data.
          distance:
            type: string
            description: Path to distance-to-water data.
          climate:
            type: string
            description: Path to climate raster.
          context_layers:
            type: object
            description: Mapping of layer name to vector file path.
            default: {}
          lat:
            type: number
            description: Latitude in decimal degrees.
          lon:
            type: number
            description: Longitude in decimal degrees.
        required:
          - dem
          - land_cover
          - soil
          - distance
          - climate
          - lat
          - lon
