# Sample configuration for casiquiare runtime parameters

logging:
  log_dir: logs               # where log files are written
  level: INFO                 # logging level

eyes:
  model: gpt-4-turbo  # API key is read from OPENAI_API_KEY

brain:
  model_type: random_forest  # or xgboost

processing:
  lidar_resolution: 1.0       # DTM grid cell size in meters
  size_range: [50.0, 300.0]   # min and max feature size for detection
  dilation_size: 3            # kernel size for edge dilation
  snippet_size: 256           # dimension of saved snippet PNGs

output:
  save_geojson: true          # export detections as GeoJSON
  save_snippets: false        # export 256x256 snippets around detections

concurrency:
  max_workers: 4              # used by scan_tiles_concurrent

milvus:
  host: localhost            # Milvus server host
  port: 19530                # Milvus server port
  collection: text_embeddings # collection name for embeddings
